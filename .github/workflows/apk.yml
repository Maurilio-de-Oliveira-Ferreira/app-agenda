# Gera o APK do app a cada push e publica em "Releases" para instalar no celular.
name: Gerar APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --timeout 60s
      - name: Preparar chave de assinatura
        env:
          ASSINATURA_APK: ${{ secrets.ASSINATURA_APK }}
        run: |
          if [ -z "$ASSINATURA_APK" ]; then
            echo "::warning::Segredo ASSINATURA_APK não configurado: o APK sai com chave temporária e não instala por cima."
            exit 0
          fi
          echo "$ASSINATURA_APK" | base64 -d > android/agenda.jks
          printf 'storeFile=agenda.jks\nkeyAlias=agenda\npassword=agenda-app\n' > android/key.properties

      # O número da versão sobe a cada build, para o Android aceitar a atualização.
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk agenda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-apk
          path: agenda.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-${{ github.run_number }}
          name: Versão de teste ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: agenda.apk
